# Dependency updates arrive as pull requests and pass the same CI gates as
# code. Two triggers exist for updates: these scheduled bumps for ordinary
# drift, and a vulnerability finding, which does not wait for the schedule.
# Bumps are grouped so a week's updates arrive as a few pull requests
# rather than one per package: actions from one repository move together
# because paired actions such as CodeQL's must run at one version, and
# Python packages move as one tree because the hash lock is recompiled
# once either way.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # pip-compile owns the resolved pins; Dependabot proposes, the compile
    # and hash regeneration happen in review before merge.
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to commit hashes; Dependabot understands hash pins
    # and proposes hash-to-hash bumps with the release tag in the diff.
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The base image is digest-pinned; bumps arrive as digest updates.
